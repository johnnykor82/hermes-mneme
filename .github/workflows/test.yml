name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          # Managed builds support SQLite extension loading on both platforms.
          # https://docs.astral.sh/uv/concepts/python-versions/
          python -m pip install uv==0.11.3
          uv venv --managed-python --python "${{ matrix.python-version }}" .venv
          uv pip install --python .venv/bin/python pytest -e .

      - name: Verify sqlite-vec is available (no skipped extension coverage)
        run: |
          .venv/bin/python -c 'import sqlite3, sqlite_vec; c = sqlite3.connect(":memory:"); c.enable_load_extension(True); sqlite_vec.load(c); print(c.execute("SELECT vec_version()").fetchone()); c.close()'

      - name: Run tests
        run: |
          .venv/bin/python -m pytest tests/ -v

      - name: Lint with ruff
        continue-on-error: true
        run: |
          uv pip install --python .venv/bin/python ruff
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
